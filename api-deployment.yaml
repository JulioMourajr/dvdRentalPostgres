apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  labels:
    app: api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      containers:
        - name: api
          image: juliomourajr92/dvdrentalpostgres:latest
          ports:
            - containerPort: 3000
          env:
            - name: DB_HOST
              value: "postgres"
            - name: DB_PORT
              value: "5432"
            - name: DB_USER
              value: "juliodocker"
            - name: DB_PASS
              value: "moura"
            - name: DB_NAME
              value: "dvdrental2024"
---
apiVersion: v1
kind: Service
metadata:
  name: api
  labels:
    app: api
spec:
  ports:
    - port: 3000
      targetPort: 3000
      nodePort: 30020
  selector:
    app: api
  type: NodePort